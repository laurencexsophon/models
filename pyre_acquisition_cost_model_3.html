<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pyre — User Acquisition Cost Model</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f3; color: #1a1a1a; padding: 2rem; }
  h1 { font-size: 18px; font-weight: 500; margin-bottom: 0.25rem; }
  .subtitle { font-size: 13px; color: #888; margin-bottom: 1.5rem; }
  .section-title { font-size: 13px; font-weight: 500; color: #666; margin: 1.5rem 0 0.75rem; }
  .controls { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 0.5rem; align-items: flex-end; }
  .control-group { display: flex; flex-direction: column; gap: 4px; }
  .control-group label { font-size: 12px; color: #666; }
  .control-group input, .control-group select { font-size: 13px; padding: 6px 10px; border-radius: 8px; border: 0.5px solid #ccc; background: #fff; color: #1a1a1a; width: 110px; }
  .tier-hint { font-size: 11px; color: #aaa; margin-top: 2px; }
  .error { font-size: 11px; color: #c0392b; margin-top: 2px; display: none; }
  .divider-v { width: 0.5px; background: #ddd; align-self: stretch; margin: 0 4px; }
  .divider-h { border: none; border-top: 0.5px solid #e0e0e0; margin: 1.25rem 0; }
  .group-label { font-size: 11px; font-weight: 500; color: #aaa; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
  .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 1.5rem; }
  .metric { background: #fff; border-radius: 8px; padding: 1rem; border: 0.5px solid #e0e0e0; }
  .metric-label { font-size: 12px; color: #888; margin-bottom: 4px; }
  .metric-value { font-size: 22px; font-weight: 500; }
  .metric-sub { font-size: 11px; color: #aaa; margin-top: 2px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; background: #fff; border-radius: 8px; overflow: hidden; border: 0.5px solid #e0e0e0; margin-bottom: 1rem; }
  th { text-align: left; font-weight: 500; font-size: 12px; color: #888; border-bottom: 0.5px solid #e0e0e0; padding: 8px 10px; background: #fafafa; }
  td { padding: 8px 10px; border-bottom: 0.5px solid #f0f0f0; }
  tr:last-child td { border-bottom: none; }
  .tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 6px; }
  .tag-min { background: #eafaf1; color: #1e8449; }
  .tag-exp { background: #eaf3fb; color: #1a5276; }
  .tag-max { background: #fbeaea; color: #922b21; }
</style>
</head>
<body>
<h1>Pyre — User Acquisition Cost Model</h1>
<p class="subtitle">Bootstrap phase · Referral + joining bonus forecast</p>

<div class="section-title" style="margin-top:0">Geography & growth</div>
<div class="controls">
  <div class="control-group">
    <label>User milestone</label>
    <select id="milestone">
      <option value="1000">1,000 users</option>
      <option value="2500">2,500 users</option>
      <option value="5000" selected>5,000 users</option>
      <option value="10000">10,000 users</option>
    </select>
  </div>
  <div class="control-group">
    <label>Referral rate (%)</label>
    <input type="number" id="refrate" value="40" min="0" max="100" />
  </div>
  <div class="divider-v"></div>
  <div class="control-group">
    <label>Tier 1 share (%)</label>
    <input type="number" id="t1share" value="60" min="0" max="100" />
  </div>
  <div class="control-group">
    <label>Tier 2 share (%)</label>
    <input type="number" id="t2share" value="30" min="0" max="100" />
  </div>
  <div class="control-group">
    <label>Tier 3 share (%)</label>
    <input type="number" id="t3share" value="10" readonly style="opacity:0.6; cursor:not-allowed;" />
    <div class="tier-hint" id="t3hint">Implied: 10%</div>
    <div class="error" id="tierror">Tier 1 + 2 must be ≤ 100%</div>
  </div>
</div>

<hr class="divider-h">

<div class="section-title">Bonus parameters</div>
<div class="controls" style="gap: 24px;">
  <div>
    <div class="group-label">Tier 1</div>
    <div style="display:flex; gap:12px; flex-wrap:wrap;">
      <div class="control-group">
        <label>Referral bonus ($)</label>
        <input type="number" id="t1ref" value="60" min="0" />
      </div>
      <div class="control-group">
        <label>Joining min ($)</label>
        <input type="number" id="t1jmin" value="5" min="0" />
      </div>
      <div class="control-group">
        <label>Joining expected ($)</label>
        <input type="number" id="t1jexp" value="20" min="0" />
      </div>
      <div class="control-group">
        <label>Joining max ($)</label>
        <input type="number" id="t1jmax" value="50" min="0" />
      </div>
    </div>
  </div>
  <div class="divider-v"></div>
  <div>
    <div class="group-label">Tier 2</div>
    <div style="display:flex; gap:12px; flex-wrap:wrap;">
      <div class="control-group">
        <label>Referral bonus ($)</label>
        <input type="number" id="t2ref" value="30" min="0" />
      </div>
      <div class="control-group">
        <label>Joining min ($)</label>
        <input type="number" id="t2jmin" value="5" min="0" />
      </div>
      <div class="control-group">
        <label>Joining expected ($)</label>
        <input type="number" id="t2jexp" value="20" min="0" />
      </div>
      <div class="control-group">
        <label>Joining max ($)</label>
        <input type="number" id="t2jmax" value="25" min="0" />
      </div>
    </div>
  </div>
</div>

<hr class="divider-h">

<div class="metrics" id="metrics"></div>

<div class="section-title">Cost breakdown by scenario</div>
<table id="breakdown"></table>

<div class="section-title">Tier breakdown at selected milestone</div>
<table id="tiertable"></table>

<script>
const MILESTONES = [1000, 2500, 5000, 10000];

function getConfig() {
  return [
    { name: 'Tier 1', refBonus: +document.getElementById('t1ref').value||0, joinMin: +document.getElementById('t1jmin').value||0, joinExp: +document.getElementById('t1jexp').value||0, joinMax: +document.getElementById('t1jmax').value||0 },
    { name: 'Tier 2', refBonus: +document.getElementById('t2ref').value||0, joinMin: +document.getElementById('t2jmin').value||0, joinExp: +document.getElementById('t2jexp').value||0, joinMax: +document.getElementById('t2jmax').value||0 },
    { name: 'Tier 3', refBonus: 0, joinMin: 0, joinExp: 0, joinMax: 0 }
  ];
}

function getInputs() {
  const refRate = Math.min(100, Math.max(0, parseFloat(document.getElementById('refrate').value)||0)) / 100;
  const t1 = Math.min(100, Math.max(0, parseFloat(document.getElementById('t1share').value)||0));
  const t2 = Math.min(100, Math.max(0, parseFloat(document.getElementById('t2share').value)||0));
  const t3 = Math.max(0, 100 - t1 - t2);
  return { refRate, shares: [t1/100, t2/100, t3/100], t3, valid: (t1+t2) <= 100 };
}

function calcCost(users, refRate, shares, scenario, cfg) {
  let total = 0;
  cfg.forEach((t, i) => {
    const n = users * shares[i];
    const joinBon = scenario === 'min' ? t.joinMin : scenario === 'exp' ? t.joinExp : t.joinMax;
    total += n * refRate * t.refBonus + n * joinBon;
  });
  return Math.round(total);
}

function calcTierCost(users, refRate, shares, scenario, cfg) {
  return cfg.map((t, i) => {
    const n = Math.round(users * shares[i]);
    const referred = Math.round(n * refRate);
    const joinBon = scenario === 'min' ? t.joinMin : scenario === 'exp' ? t.joinExp : t.joinMax;
    const refCost = referred * t.refBonus;
    const joinCost = n * joinBon;
    return { ...t, n, referred, refCost, joinCost, total: refCost + joinCost };
  });
}

function fmt(n) { return '$' + Math.round(n).toLocaleString(); }

function render() {
  const { refRate, shares, t3, valid } = getInputs();
  const cfg = getConfig();
  const users = parseInt(document.getElementById('milestone').value);

  document.getElementById('t3share').value = Math.round(t3);
  document.getElementById('t3hint').textContent = 'Implied: ' + Math.round(t3) + '%';
  document.getElementById('tierror').style.display = valid ? 'none' : 'block';
  if (!valid) return;

  const expCost = calcCost(users, refRate, shares, 'exp', cfg);
  const minCost = calcCost(users, refRate, shares, 'min', cfg);
  const maxCost = calcCost(users, refRate, shares, 'max', cfg);
  const referred = Math.round(users * refRate);
  const perUser = users > 0 ? Math.round(expCost / users) : 0;

  document.getElementById('metrics').innerHTML =
    '<div class="metric"><div class="metric-label">Expected total cost</div><div class="metric-value">' + fmt(expCost) + '</div><div class="metric-sub">' + users.toLocaleString() + ' users · ' + Math.round(refRate*100) + '% referral</div></div>' +
    '<div class="metric"><div class="metric-label">Min total cost</div><div class="metric-value">' + fmt(minCost) + '</div><div class="metric-sub">All users take min joining bonus</div></div>' +
    '<div class="metric"><div class="metric-label">Max total cost</div><div class="metric-value">' + fmt(maxCost) + '</div><div class="metric-sub">All users win max joining bonus</div></div>' +
    '<div class="metric"><div class="metric-label">Expected cost per user</div><div class="metric-value">' + fmt(perUser) + '</div><div class="metric-sub">' + referred.toLocaleString() + ' referred users</div></div>';

  let bRows = '<tr><th>Milestone</th><th>Ref rate</th><th><span class="tag tag-min">Min</span></th><th><span class="tag tag-exp">Expected</span></th><th><span class="tag tag-max">Max</span></th></tr>';
  MILESTONES.forEach(function(m) {
    [0.30, 0.40, 0.50].forEach(function(r, i) {
      const row = '<td>' + Math.round(r*100) + '%</td><td>' + fmt(calcCost(m,r,shares,'min',cfg)) + '</td><td>' + fmt(calcCost(m,r,shares,'exp',cfg)) + '</td><td>' + fmt(calcCost(m,r,shares,'max',cfg)) + '</td>';
      bRows += i === 0
        ? '<tr><td rowspan="3" style="font-weight:500">' + m.toLocaleString() + '</td>' + row + '</tr>'
        : '<tr>' + row + '</tr>';
    });
  });
  document.getElementById('breakdown').innerHTML = bRows;

  const tiers = calcTierCost(users, refRate, shares, 'exp', cfg);
  let tRows = '<tr><th>Tier</th><th>Users</th><th>Referred</th><th>Referral cost</th><th>Joining cost</th><th>Total</th></tr>';
  tiers.forEach(function(t) {
    tRows += '<tr><td style="font-weight:500">' + t.name + '</td><td>' + t.n.toLocaleString() + '</td><td>' + t.referred.toLocaleString() + '</td><td>' + fmt(t.refCost) + '</td><td>' + fmt(t.joinCost) + '</td><td style="font-weight:500">' + fmt(t.total) + '</td></tr>';
  });
  const totRef = tiers.reduce(function(a,t){return a+t.refCost;},0);
  const totJoin = tiers.reduce(function(a,t){return a+t.joinCost;},0);
  tRows += '<tr style="font-weight:500"><td>Total</td><td>' + users.toLocaleString() + '</td><td>' + referred.toLocaleString() + '</td><td>' + fmt(totRef) + '</td><td>' + fmt(totJoin) + '</td><td>' + fmt(expCost) + '</td></tr>';
  document.getElementById('tiertable').innerHTML = tRows;
}

['milestone','refrate','t1share','t2share','t1ref','t1jmin','t1jexp','t1jmax','t2ref','t2jmin','t2jexp','t2jmax'].forEach(function(id) {
  document.getElementById(id).addEventListener('input', render);
  document.getElementById(id).addEventListener('change', render);
});
render();
</script>
</body>
</html>
